name: Test, Package & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==============================================================================
  # 1. QUALITY GATE — Run all test suites before any packaging/release
  # ==============================================================================
  quality-gate-test:
    name: 🧪 Run Full Test Suite (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies & Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            xvfb \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-shapes \
            qml6-module-qtqml-workerscript \
            qml6-module-qtcore \
            qml6-module-qtqml \
            qml6-module-qtqml-models

      - name: Run Full Health Check (scripts/linux/check.sh)
        run: |
          xvfb-run -a bash scripts/linux/check.sh

  # ==============================================================================
  # 2. LINUX DISTRIBUTIONS (Debian, Ubuntu, Fedora, Arch Linux, Portable Tarball)
  # ==============================================================================
  build-linux:
    name: 🐧 Package Linux (Debian, Ubuntu, Fedora, Arch)
    needs: quality-gate-test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            rpm \
            zstd \
            libgl1-mesa-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-shapes \
            qml6-module-qtqml-workerscript \
            qml6-module-qtcore \
            qml6-module-qtqml \
            qml6-module-qtqml-models

      - name: Build Desktop Application (git_flux)
        run: |
          cmake --preset linux-qt-release
          cmake --build --preset linux-qt-release -j $(nproc) --target git_flux

      - name: Package for Debian / Ubuntu (.deb)
        run: |
          bash scripts/package/package_deb.sh

      - name: Package for Fedora / RHEL (.rpm)
        run: |
          bash scripts/package/package_rpm.sh

      - name: Package for Arch Linux (.pkg.tar.zst)
        run: |
          bash scripts/package/package_arch.sh

      - name: Package Generic Linux Tarball (.tar.gz)
        run: |
          bash scripts/package/package_tarball.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: build/packages/*
          if-no-files-found: error

  # ==============================================================================
  # 3. WINDOWS PACKAGING (x64 ZIP with windeployqt)
  # ==============================================================================
  build-windows:
    name: 🪟 Package Windows (x64)
    needs: quality-gate-test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Ensure OpenSSL is available
        shell: pwsh
        run: |
          $sslPaths = @("C:\Program Files\OpenSSL", "C:\Program Files\OpenSSL-Win64")
          $found = $false
          foreach ($p in $sslPaths) {
            if (Test-Path $p) {
              Write-Host "Found pre-installed OpenSSL at: $p"
              "OPENSSL_ROOT_DIR=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "$p\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "Installing OpenSSL via Chocolatey..."
            choco install openssl --no-progress
            "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "C:\Program Files\OpenSSL-Win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Configure CMake
        run: cmake -B build/qt-msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DGF_BUILD_DESKTOP=ON -DGF_BUILD_TESTING=OFF -DGF_BUILD_BENCHMARKS=OFF

      - name: Build git_flux
        run: cmake --build build/qt-msvc --target git_flux

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Run Windows Packaging Script
        shell: pwsh
        run: |
          .\scripts\package\package_windows.ps1 -BuildDir "build/qt-msvc" -OutputDir "build/packages" -Version "0.1.0"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            build/packages/*.zip
            build/packages/*.exe
          if-no-files-found: error

  # ==============================================================================
  # 4. MACOS PACKAGING (.dmg & .zip with macdeployqt)
  # ==============================================================================
  build-macos:
    name: 🍏 Package macOS (.dmg & .zip)
    needs: quality-gate-test
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6 & Ninja via Homebrew
        run: |
          brew install qt@6 ninja
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Build and Package macOS App & DMG
        run: |
          CMAKE_PREFIX_PATH="$(brew --prefix qt@6)" bash scripts/package/package_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: build/packages/*macos*
          if-no-files-found: error

  # ==============================================================================
  # 5. CREATE GITHUB RELEASE & UPLOAD ALL DISTRO PACKAGES
  # ==============================================================================
  publish-release:
    name: 🚀 Create GitHub Release & Upload Packages
    needs: [quality-gate-test, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Package Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Compute Checksums (SHA256)
        working-directory: dist-release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag and Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="Git Flux ${TAG_NAME}"
            PRERELEASE="false"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="v0.1.0-build.${{ github.run_number }}"
            RELEASE_NAME="Git Flux v0.1.0 (Build ${{ github.run_number }} - ${SHORT_SHA})"
            PRERELEASE="false"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist-release/*
          body: |
            ## Git Flux — Official Multi-Platform Distribution Packages

            Automated release built and tested against main branch commit `${{ github.sha }}`.

            ### Available Distribution Packages:
            - **Ubuntu / Debian**: `.deb` package
            - **Fedora / Red Hat**: `.rpm` package
            - **Arch Linux / Manjaro**: `.pkg.tar.zst` package
            - **Generic Linux**: `.tar.gz` portable standalone archive
            - **Windows**: `.exe` setup installer & `.zip` portable bundle (includes Qt runtime)
            - **macOS**: `.dmg` installer & `.zip` bundle

            ### Integrity:
            All packages are verified with SHA-256 checksums available in `SHA256SUMS.txt`.

  # ==============================================================================
  # 6. PUBLISH TO WINDOWS PACKAGE MANAGER (WINGET)
  # ==============================================================================
  publish-winget:
    name: 🪟 Publish to WinGet (Windows Package Manager)
    needs: publish-release
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Publication Conditions
        id: check_conditions
        run: |
          IS_TAG="false"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_TAG="true"
          fi

          IS_DISPATCH="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IS_DISPATCH="true"
          fi

          HAS_TOKEN="false"
          if [ -n "${{ secrets.WINGET_TOKEN }}" ]; then
            HAS_TOKEN="true"
          fi

          echo "is_tag=${IS_TAG}" >> $GITHUB_OUTPUT
          echo "is_dispatch=${IS_DISPATCH}" >> $GITHUB_OUTPUT
          echo "has_token=${HAS_TOKEN}" >> $GITHUB_OUTPUT

          if [ "$IS_TAG" != "true" ] && [ "$IS_DISPATCH" != "true" ]; then
            echo "ℹ️ Push su branch '${{ github.ref_name }}' rilevato (non un tag di release)."
            echo "ℹ️ La pubblicazione su WinGet (microsoft/winget-pkgs) è attiva per i tag ufficiali (es: 'git tag v0.1.0 && git push origin v0.1.0') oppure tramite avvio manuale con 'Run workflow' dalla tab Actions."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          elif [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Il secret WINGET_TOKEN non è ancora configurato nei Secret di GitHub."
            echo "::notice::Per abilitare la pubblicazione automatica su WinGet, configura WINGET_TOKEN seguendo le istruzioni in packaging/winget/README.md."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "✔ Condizioni soddisfatte: avvio pubblicazione WinGet per tag '${{ needs.publish-release.outputs.tag_name }}'."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to microsoft/winget-pkgs via winget-releaser
        if: steps.check_conditions.outputs.should_publish == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: GitFlux.GitFlux
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: 'windows-x64\.zip$'
          release-tag: ${{ needs.publish-release.outputs.tag_name }}
          max-versions-to-keep: 5

  # ==============================================================================
  # 7. PUBLISH LINUX REPOSITORIES & GITHUB PAGES
  # ==============================================================================
  publish-pages:
    name: 🌐 Publish GitHub Pages (APT Repo & Website)
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Package Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Install APT Repository Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg

      - name: Build Pages & APT Repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          bash scripts/package/generate_pages.sh

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
          force_orphan: true
